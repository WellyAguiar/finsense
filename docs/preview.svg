    <text x="20" y="68" class="mono" font-size="26" font-weight="700" fill="#F8FAFC">R$ 3.190,40</text>
    <text x="20" y="92" class="mono" font-size="11" fill="#F472B6">CC_PAYMENT pareado automaticamente</text>
