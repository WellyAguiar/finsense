    <line x1="40" y1="165" x2="530" y2="165" stroke="#2E1065" stroke-dasharray="4 4" />
    <line x1="40" y1="230" x2="530" y2="230" stroke="#2E1065" stroke-dasharray="4 4" />
    <line x1="40" y1="295" x2="530" y2="295" stroke="#4C1D95" />

    <!-- Bars -->
    <rect x="75" y="145" width="38" height="150" rx="5" fill="url(#barGrad)" />
    <rect x="165" y="130" width="38" height="165" rx="5" fill="url(#barGrad)" />
    <rect x="255" y="155" width="38" height="140" rx="5" fill="url(#barGrad)" />
    <rect x="345" y="115" width="38" height="180" rx="5" fill="url(#barGrad)" />
    <rect x="435" y="98" width="38" height="197" rx="5" fill="#E879F9" />

    <text x="94" y="318" text-anchor="middle" class="mono" font-size="11" fill="#A78BFA">JUL</text>
    <text x="184" y="318" text-anchor="middle" class="mono" font-size="11" fill="#A78BFA">AGO</text>
    <text x="274" y="318" text-anchor="middle" class="mono" font-size="11" fill="#A78BFA">SET</text>
    <text x="364" y="318" text-anchor="middle" class="mono" font-size="11" fill="#A78BFA">OUT</text>
    <text x="454" y="318" text-anchor="middle" class="mono" font-size="11" fill="#F3E8FF">NOV</text>

    <!-- Bottom Deduction Alert -->
    <rect x="24" y="340" width="512" height="38" rx="7" fill="#1A1033" stroke="#6B21A8" stroke-width="1" />
    <text x="40" y="364" class="mono" font-size="11" fill="#D8B4FE">✓ 3 transferências entre contas próprias (TRANSFER) filtradas do cálculo</text>
  </g>

  <!-- Right Panel: Gemini SQL Tool-Calling Chat -->
  <g transform="translate(824, 196)">
    <rect width="350" height="398" rx="10" fill="url(#cardBg)" stroke="#581C87" stroke-width="1" />
    <text x="20" y="34" class="mono" font-size="13" font-weight="700" fill="#E879F9">// GEMINI SQL ASSISTANT</text>
    <line x1="0" y1="48" x2="350" y2="48" stroke="#3B0764" />

    <rect x="44" y="66" width="286" height="44" rx="8" fill="#4C1D95" fill-opacity="0.55" />
    <text x="58" y="85" class="sans" font-size="11.5" fill="#F8FAFC">Quanto gastei com assinaturas e</text>
    <text x="58" y="101" class="sans" font-size="11.5" fill="#F8FAFC">nuvem nos últimos 3 meses?</text>

    <rect x="20" y="126" width="310" height="32" rx="6" fill="#0B0714" stroke="#6B21A8" stroke-width="1" />
    <text x="32" y="146" class="mono" font-size="10.5" fill="#C084FC">⚡ tool: queryReadOnlySQL (PostgreSQL)</text>

    <rect x="20" y="172" width="310" height="162" rx="8" fill="#140C29" stroke="#3B0764" stroke-width="1" />
    <text x="34" y="196" class="sans" font-size="11.5" fill="#E2E8F0">Total de R$ 642,70 no trimestre:</text>
    <rect x="34" y="214" width="210" height="12" rx="3" fill="#A855F7" />
    <text x="254" y="224" class="mono" font-size="10" fill="#E9D5FF">R$ 230</text>
    <rect x="34" y="238" width="185" height="12" rx="3" fill="#8B5CF6" />
    <text x="229" y="248" class="mono" font-size="10" fill="#E9D5FF">R$ 198</text>
    <rect x="34" y="262" width="195" height="12" rx="3" fill="#C084FC" />
    <text x="239" y="272" class="mono" font-size="10" fill="#E9D5FF">R$ 214</text>
    <text x="34" y="308" class="mono" font-size="10" fill="#F472B6">Alerta: reajuste de +8% detectado em Nov.</text>

    <rect x="20" y="350" width="310" height="32" rx="6" fill="#0B0714" stroke="#4C1D95" stroke-width="1" />
    <text x="34" y="370" class="sans" font-size="11" fill="#64748B">Pergunte sobre seus dados reais...</text>
  </g>
