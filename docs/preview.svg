<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090612" />
      <stop offset="100%" stop-color="#110A22" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#160F29" />
      <stop offset="100%" stop-color="#0E091B" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- App Window Frame -->
  <rect width="1200" height="620" rx="14" fill="url(#canvasBg)" stroke="#4C1D95" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="44" rx="14" fill="#120B24" />
  <rect x="0" y="30" width="1200" height="14" fill="#120B24" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#3B0764" stroke-width="1" />
  <circle cx="24" cy="22" r="5.5" fill="#EF4444" opacity="0.85" />
  <circle cx="42" cy="22" r="5.5" fill="#F59E0B" opacity="0.85" />
  <circle cx="60" cy="22" r="5.5" fill="#10B981" opacity="0.85" />
  <text x="600" y="27" text-anchor="middle" class="mono" font-size="12" fill="#A78BFA">finsense.app // Painel Consolidado + Chat IA SQL</text>

  <!-- Left Sidebar -->
  <rect x="0" y="45" width="220" height="574" fill="#0C0718" />
  <line x1="220" y1="45" x2="220" y2="620" stroke="#2E1065" stroke-width="1" />
  <text x="28" y="86" class="mono" font-size="18" font-weight="800" fill="#E9D5FF">FinSense</text>
  <rect x="16" y="108" width="188" height="36" rx="8" fill="#581C87" fill-opacity="0.45" stroke="#A855F7" stroke-width="1" />
  <text x="34" y="131" class="sans" font-size="13" font-weight="600" fill="#F3E8FF">Visão Geral</text>
  <text x="34" y="172" class="sans" font-size="13" fill="#94A3B8">Transações</text>
  <text x="34" y="208" class="sans" font-size="13" fill="#94A3B8">Cartões &amp; Faturas</text>
  <text x="34" y="244" class="sans" font-size="13" fill="#94A3B8">Leitor PDF / Pix (IA)</text>
  <text x="34" y="280" class="sans" font-size="13" fill="#C084FC">Chat SQL Gemini</text>
  <text x="34" y="316" class="sans" font-size="13" fill="#94A3B8">Planejamento &amp; Metas</text>

  <!-- Open Finance Badge in Sidebar -->
  <rect x="16" y="546" width="188" height="52" rx="8" fill="#130C26" stroke="#4C1D95" stroke-width="1" />
  <circle cx="34" cy="566" r="4.5" fill="#34D399" />
  <text x="46" y="570" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">OPEN FINANCE SYNC</text>
  <text x="30" y="588" class="mono" font-size="10" fill="#A78BFA">4 bancos conectados • Pluggy</text>

  <!-- KPI Cards Row -->
