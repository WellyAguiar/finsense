    <text x="20" y="68" class="mono" font-size="24" font-weight="700" fill="#E9D5FF">R$ 14.200 / R$ 6.830</text>
    <text x="20" y="92" class="mono" font-size="11" fill="#C084FC">Taxa de poupança: 51,9% • Centavos bigint</text>
  </g>

  <g transform="translate(866, 68)">
